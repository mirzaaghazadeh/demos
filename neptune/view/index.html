<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیش‌نمایش قالب نپتون — انتخاب پوسته | Neptune Admin Preview</title>
<meta name="description" content="پیش‌نمایش زندهٔ قالب HTML پنل مدیریت نپتون — چهار پوسته روشن و تیره، بیش از ۲۵۰ صفحهٔ آماده.">
<style>
:root{--bg:#0b1622;--card:#132434;--ink:#e8f1f8;--muted:#8fa9bd;--accent:#2fa8e0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:linear-gradient(160deg,#0b1622,#12304a);color:var(--ink);
     font-family:Tahoma,"Segoe UI",sans-serif;padding:32px}
.wrap{width:100%;max-width:860px;text-align:center}
h1{font-size:26px;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 28px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
a.card{display:block;padding:22px 18px;border-radius:14px;background:var(--card);
       border:1px solid rgba(255,255,255,.07);color:var(--ink);text-decoration:none;
       transition:transform .15s ease,border-color .15s ease}
a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
a.card b{display:block;font-size:17px;margin-bottom:4px}
a.card span{color:var(--muted);font-size:13px}
footer{margin-top:26px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>پیش‌نمایش قالب پنل مدیریت نپتون</h1>
  <p class="sub">یکی از چهار پوستهٔ آماده را برای مشاهدهٔ پیش‌نمایش انتخاب کنید.</p>
  <div class="grid">
    <a class="card" href="templates/Admin1/"><b>Admin 1</b><span>پوستهٔ روشن</span></a>
    <a class="card" href="templates/Admin1-Dark/"><b>Admin 1 Dark</b><span>پوستهٔ تیره</span></a>
    <a class="card" href="templates/Admin2/"><b>Admin 2</b><span>پوستهٔ روشن</span></a>
    <a class="card" href="templates/Admin2-Dark/"><b>Admin 2 Dark</b><span>پوستهٔ تیره</span></a>
  </div>
  <footer>بیش از ۲۵۰ صفحهٔ آماده · بوت‌استرپ ۵ · راست‌چین</footer>
</div>
</body>
</html>
