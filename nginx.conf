# demos.navid.tr — static hosting for the product landings and templates.
#
# Everything here is plain static files: one directory per product, each with a
# landing (index.html) and the real template under view/.
#
# The rules that matter for this site:
#   * try_files ... =404  — a directory without an index returns 404, not the
#     403 the default config gives (nginx refuses to list directories). Nothing
#     links to such a path, but a reviewer poking at one should see a clean 404.
#   * Files beginning with "_" must be served: Finapp is a PWA and ships
#     __manifest.json and __service-worker.js. Do not add a rule that hides
#     dotfile-ish names.
#   * HTML is never cached, assets are cached hard. The landings are what QC
#     checks, so a stale one is a real cost.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    absolute_redirect off;   # keep redirects on the requested host, not the container's
    autoindex off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    # ORDER MATTERS: nginx uses the FIRST matching regex location. The service
    # worker must come before the generic css/js rule, or it inherits a week-long
    # cache and buyers keep running the old app shell.
    location ~* __service-worker\.js$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # مالیات‌یار's slug became maliyatyar on 2026-10-23. The old landing path (registered in
    # listings) redirects permanently. ^~ wins over every regex location below.
    location ^~ /maliatyar {
        rewrite ^/maliatyar(/.*)?$ /maliyatyar$1 permanent;
    }

    # Video: byte ranges must survive the way to the browser (Safari plays nothing without
    # 206 answers). Coolify's proxy (Traefik compress) gzips mp4 for Cloudflare's full fetch,
    # ignoring no-transform; Cloudflare cached that copy and answered every Range request with
    # the whole file (2026-10-23). «private» keeps Cloudflare from caching video, so the
    # browser's Range requests reach the origin, which answers 206 (Traefik leaves ranged
    # responses alone). A changed video needs a new file name: Cloudflare kept earlier copies.
    location ~* \.(?:mp4|webm)$ {
        add_header Cache-Control "private, max-age=86400, no-transform" always;
        try_files $uri =404;
    }

    # `expires` together with `add_header Cache-Control` emits the header TWICE;
    # add_header alone is enough. woff2 is already compressed, so it is not in
    # gzip_types above.
    # NO `always` here: with it, a 404 for an asset went out «public, max-age=2592000,
    # immutable». A browser that asked for a new image while a deploy was still rolling kept
    # the 404 for 30 days (maliyatyar hero, 2026-10-24). Without `always` the header is only
    # added to 2xx/3xx answers.
    # A missing asset answers no-store explicitly: with no header at all, Cloudflare adds its
    # default browser TTL (max-age=14400), which still pinned a deploy-time 404 for 4 hours.
    location ~* \.(?:woff2?|ttf|eot|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        error_page 404 = @asset_404;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        error_page 404 = @asset_404;
        try_files $uri =404;
    }

    location @asset_404 {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Landings change whenever a product is updated — never serve a stale one.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # `$uri/` alone SUCCEEDS on a directory and then fails inside the index
    # module, which yields 403 rather than falling through to =404. Asking for
    # the index file explicitly is what makes an index-less directory a clean 404.
    #
    # That same choice skips nginx's normal directory-redirect: requesting a
    # product path with no trailing slash (e.g. /rahjoo instead of /rahjoo/)
    # served the landing's HTML directly at the slash-less URL instead of
    # redirecting first. Every relative asset in the page (shots/*.png etc.)
    # then resolved against the wrong base and 404'd — page loads, images
    # don't (found 2026-09-03 on /rahjoo, live-confirmed site-wide). The `if`
    # here is the standard, nginx-docs-sanctioned exception to "if is evil":
    # a single `-d` file test with no other logic in the block.
    location / {
        if (-d $request_filename) {
            rewrite ^(.+[^/])$ $1/ permanent;
        }
        try_files $uri $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
